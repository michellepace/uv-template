[build-system]
# Packaged for the [project.scripts] CLIs only; never published.
requires = ["uv_build>=0.11.25,<0.12"]
build-backend = "uv_build"

[project]
name = "uv-package-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
uv-package-template = "uv_package_template:main"

[dependency-groups]
dev = [
  "pre-commit>=4.6.0",
  "pyright>=1.1.411",
  "pytest>=9.1.1",
  "ruff>=0.15.20",
]


# TESTING (PYTEST)
# =================================
[tool.pytest.ini_options]
testpaths = ["tests"] # only collect from tests/ (faster)
addopts = "-ra"       # show summary skipped/failed end of run


# TYPE CHECKING (PYRIGHT)
# =================================
[tool.pyright]
typeCheckingMode = "standard" # Keep (not strict!)
pythonVersion = "3.14"
venvPath = "."                # Claude Code Official: LSP plugin
venv = ".venv"                # Claude Code Official: LSP plugin
reportUnusedImport = false    # Ruff F401
reportUnusedVariable = false  # Ruff F841
reportDuplicateImport = false # Ruff F811


# LINTING (RUFF)
# =================================
[tool.ruff]
line-length = 90
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [ # ignore incompatible or overly pedantic rules
  "D100",   # Missing docstring in public module
  "D104",   # Missing docstring in public package
  "D203",   # blank line before class docstring (conflicts with D211)
  "D213",   # multi-line summary starts on line 2 (conflicts with D212)
  "COM812", # Trailing comma missing (conflicts with formatter)
  "ISC001", # implicit string concatenation (conflicts with formatter)
  "T201",   # Print found (allow print statements)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",    # assert statements are idiomatic in tests
  "PLR2004", # literal expected values are fine
  "D103",    # docstrings not required on test functions
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10
